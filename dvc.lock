          pretrained: true
          in_chans: 3
          drop_rate: 0.0
          drop_path_rate: 0.0
          batch_size: 256
          num_workers: 0
          epochs: 30
          optimizer: adamw
          lr: 0.0003
          weight_decay: 0.0001
          early_stopping: true
          early_stopping_patience: 5
          early_stopping_min_delta: 0.001
          class_weights: true
