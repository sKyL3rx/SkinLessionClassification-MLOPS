      hash: md5
      md5: fda31b9f62a8b358f333ba7af8266ba2
      size: 758
  export_onnx:
    cmd: python scripts/export_onnx.py --config params.yaml
    deps:
    - path: artifacts/models/best.ckpt
      hash: md5
      md5: 5616983abe22ceb89705130e20fbf4a0
      size: 334094901
