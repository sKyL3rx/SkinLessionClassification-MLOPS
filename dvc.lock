      hash: md5
      md5: 5d991f4d767801f6713204e9302cfd1e
      size: 2329
    - path: src/lesion_ml
      hash: md5
      md5: ad9923ae72807c54af940401044b89ae.dir
      size: 12870
      nfiles: 4
    params:
      params.yaml:
        data.image_size: 224
        inference.checkpoint_path: artifacts/models/best.ckpt
        inference.onnx_path: deployment/onnx/model.onnx
    outs:
