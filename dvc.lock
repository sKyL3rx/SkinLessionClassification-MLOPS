schema: '2.0'
stages:
  prepare_data:
    cmd: python scripts/prepare_ham10000.py --config params.yaml
    deps:
    - path: scripts/prepare_ham10000.py
      hash: md5
      md5: 7b48cb885128c0a253b0955c9578da31
      size: 8918
    params:
      params.yaml:
        data.labels:
        - akiec
        - bcc
        - bkl
        - df
        - mel
        - nv
        - vasc
        data.metadata_csv: data/processed/metadata.csv
        data.raw_dir: data/raw/ham10000
    outs:
    - path: data/processed/metadata.csv
      hash: md5
      md5: 8ebc759a169aae845299e96c286428ad
      size: 1194255
  make_splits:
    cmd: python scripts/make_grouped_splits.py --config params.yaml
    deps:
    - path: data/processed/metadata.csv
      hash: md5
      md5: 8ebc759a169aae845299e96c286428ad
      size: 1194255
    - path: scripts/make_grouped_splits.py
      hash: md5
      md5: bb286dce4d15d34d28fc3c763a012b9f
      size: 7306
    params:
      params.yaml:
        data.group_by: split_group
        data.metadata_csv: data/processed/metadata.csv
        data.splits_dir: data/splits
        data.test_size: 0.1
        data.val_size: 0.1
        project.seed: 42
    outs:
    - path: data/splits/test.csv
      hash: md5
      md5: 2aab1d49108a44db751603b20cde1296
      size: 124658
    - path: data/splits/train.csv
      hash: md5
      md5: 83660e4c621b4b2e0bbb3cb3c011e39b
      size: 1003350
    - path: data/splits/val.csv
      hash: md5
      md5: 4cacc60454d87cfcb22edfa6d48d75b0
      size: 123517
  train:
    cmd: python scripts/train.py --config params.yaml
    deps:
    - path: data/splits/train.csv
      hash: md5
      md5: 83660e4c621b4b2e0bbb3cb3c011e39b
      size: 1003350
    - path: data/splits/val.csv
      hash: md5
      md5: 4cacc60454d87cfcb22edfa6d48d75b0
      size: 123517
    - path: scripts/train.py
      hash: md5
      md5: c13dd1aff2fb8bba8305932e0641d73a
      size: 11900
    - path: src/lesion_ml
      hash: md5
      md5: ad9923ae72807c54af940401044b89ae.dir
      size: 12870
      nfiles: 4
    params:
      params.yaml:
        augment:
          use_random_resized_crop: false
          crop_scale:
          - 0.7
          - 1.0
          crop_ratio:
          - 0.75
          - 1.33
          horizontal_flip_p: 0.5
          vertical_flip_p: 0.5
          shift_limit: 0.05
          scale_limit: 0.1
          rotate_limit: 45
          geometric_p: 0.5
          brightness: 0.2
          contrast: 0.2
          saturation: 0.2
          hue: 0.05
          color_jitter_p: 0.3
          normalize: true
        data.image_size: 224
        data.num_classes: 7
        project.seed: 42
        train:
          backbone: convnext_tiny
          pretrained: true
          batch_size: 128
          num_workers: 2
          epochs: 30
          optimizer: adamw
          lr: 0.0001
          weight_decay: 0.0001
          scheduler: cosine
          loss: cross_entropy
          class_weights: true
          weighted_sampler: false
          mixed_precision: true
          early_stopping: true
          early_stopping_patience: 5
          early_stopping_min_delta: 0.001
    outs:
    - path: artifacts/models/best.ckpt
      hash: md5
      md5: 5616983abe22ceb89705130e20fbf4a0
      size: 334094901
    - path: artifacts/reports/train_history.csv
      hash: md5
      md5: 635846a5cf02a0b2c8193324ce5d762f
      size: 3748
    - path: artifacts/reports/train_metrics.json
      hash: md5
      md5: b29a8a1acc44e85a5ff17adfa48bdcab
      size: 380
  evaluate:
    cmd: python scripts/evaluate.py --config params.yaml
    deps:
    - path: artifacts/models/best.ckpt
      hash: md5
      md5: 5616983abe22ceb89705130e20fbf4a0
      size: 334094901
    - path: data/splits/test.csv
      hash: md5
      md5: 2aab1d49108a44db751603b20cde1296
      size: 124658
    - path: scripts/evaluate.py
      hash: md5
      md5: b207ceba6be30048c7ea0d77d514e7c0
      size: 10501
    - path: src/lesion_ml
      hash: md5
      md5: ad9923ae72807c54af940401044b89ae.dir
      size: 12870
      nfiles: 4
    params:
      params.yaml:
        evaluate.confidence_threshold: 0.65
        evaluate.primary_metric: macro_f1
        evaluate.top_k: 3
    outs:
    - path: artifacts/reports/confusion_matrix.csv
      hash: md5
      md5: 3036baa58a26f61dac195f026d843eba
      size: 169
    - path: artifacts/reports/per_class_metrics.csv
      hash: md5
