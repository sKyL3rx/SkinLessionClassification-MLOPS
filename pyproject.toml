[build-system]
requires = [
  "setuptools>=68",
  "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "skin-lesion-mlops"
version = "0.1.0"
description = "End-to-end skin lesion classification and review-triage system"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
  { name = "Skyler" }
]

dependencies = [
  "numpy>=1.26.0",
  "opencv-python-headless>=4.10.0",
  "pandas>=2.2.0",
  "pillow>=10.4.0",
  "PyYAML>=6.0.2"
]

[project.optional-dependencies]
train = [
  "albumentations>=1.4.0",
  "matplotlib>=3.11.0",
  "scikit-learn>=1.5.0",
  "scipy>=1.14.0",
  "timm>=1.0.0",
  "torch>=2.4.0",
  "torchvision>=0.19.0",
  "tqdm>=4.66.0",
]
onnx-export = [
  "onnx>=1.16.0",
  "onnxscript>=0.1.0",
]

onnx-cpu = [
  "onnxruntime>=1.27,<1.28",
]

onnx-gpu = [
  "onnxruntime-gpu>=1.27,<1.28",
]


api = [
  "fastapi>=0.115.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.22",
  "uvicorn[standard]>=0.30.0"
]


demo = [
  "gradio",
  "httpx>=0.27.0"
]

mlops = [
  "dvc[s3]>=3.67.0"
]

notebook = [
  "ipykernel>=6.29.0",
  "jupyter>=1.1.0"
]

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0"
]


[tool.uv]
environments = [
  "sys_platform == 'linux'",
]

conflicts = [
  [
    { extra = "onnx-cpu" },
    { extra = "onnx-gpu" },
  ],
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "src"
]

testpaths = [
  "tests"
]

addopts = "-ra --strict-markers"

markers = [
  "artifact: tests requiring model artifacts",
  "data: tests requiring real dataset files",
  "slow: tests excluded from fast CI"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B"
]
