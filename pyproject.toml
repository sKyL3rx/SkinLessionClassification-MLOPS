[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skin-lesion-mlops"
version = "0.1.0"
description = "End-to-end skin lesion classification and triage system"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Skyler" }
]

dependencies = [
  "albumentations>=1.4.0",
  "dvc[gs]>=3.67.0",
  "fastapi>=0.115.0",
  "mlflow>=2.15.0",
  "numpy>=1.26.0",
  "onnx>=1.16.0",
  "onnxruntime>=1.19.0",
  "onnxscript>=0.1.0",
  "opencv-python-headless>=4.10.0",
  "pandas>=2.2.0",
  "pillow>=10.4.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.22",
  "PyYAML>=6.0.2",
  "scikit-learn>=1.5.0",
  "scipy>=1.14.0",
  "timm>=1.0.0",
  "torch>=2.4.0",
  "torchvision>=0.19.0",
  "tqdm>=4.66.0",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "ipykernel>=6.29.0",
  "jupyter>=1.1.0",
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "src"
]
testpaths = [
  "tests"
]
addopts = "-ra --strict-markers"
markers = [
  "artifact: tests that require local model artifacts such as ONNX/checkpoints",
  "data: tests that require real dataset files",
  "slow: tests that are too slow for default CI"
]
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"deployment/api/main.py" = ["B008"]