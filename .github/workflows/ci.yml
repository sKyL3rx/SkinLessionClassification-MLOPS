name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "dev/**"
  pull_request:
    branches:
      - main

jobs:
  fast-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-0 libgl1

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Compile Python files
        run: |
          python -m compileall src scripts deployment tests
      
      - name: Run fast tests
        run: |
          python -m pytest tests -m "not artifact and not data and not slow" -q
      
      - name: Lint
        run: |
          python -m ruff check .